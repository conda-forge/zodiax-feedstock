{% set name = "zodiax" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/zodiax-{{ version }}.tar.gz
  sha256: 1d630483a6189c1cb65b90285537259f2ce4cf206407d0f7aece316e6a97ec22

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }},<4.0
    - equinox
    - jax
    - jaxlib
    - jaxtyping
    - numpy
    - optax

test:
  imports:
    - zodiax
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/LouisDesdoigts/zodiax
  summary: Equinox extension for scientific programming
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - LouisDesdoigts
    - christhechris
